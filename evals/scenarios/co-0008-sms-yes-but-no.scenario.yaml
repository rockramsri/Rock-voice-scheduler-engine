# V1b — mixed yes-but-no must NOT lock (B1). The agent should decline
# and learn weekend avoidance.
scenario_id: co-0008-sms-yes-but-no
schema_version: 1
scenario_version: 1
description: >
  Nurse texts "yes but not this weekend, no"; offer stays unfilled and
  is declined with avoid_dows Saturday/Sunday.
layer: simulation
purpose: [regression, eval]
channel: sms
engine_profile: cascade
callout_fixture: {shift: SH-1, specialty: wound care, area: Jersey City,
                  starts_in_hours: 26, callout_nurse: CG-330}
roster_fixture:
  - {slug: CG-101, name: Ana Reyes, phone: "555-9101"}
  - {slug: CG-330, name: Carla Jones, phone: "555-9330"}
persona:
  style: cooperative
  policy:
    - Your first reply is exactly: yes but not this weekend, no
    - Do not accept the shift. Weekends never work for you.
expected_end_state: {shift: SH-1, status: offers_out, winner: null}
expected_rank_order: [CG-101]
expected_memory:
  CG-101: {avoid_dows: [5, 6]}
max_turn_budget: 3
invariants: [no_double_text]
judge_rubric:
  - Did the agency accept the decline without assigning the shift?
  - Did the reply acknowledge weekends?
gates: [oracle_verdict]
k_trials: 3
seed: 47
tags: [sms, b1, v1b, memory]
