# V6 — persona talks past the 3-minute stale window then accepts (B2).
# The worker may have flipped the offer to no_answer; accept must still
# fill the shift and must not stand the winner down.
scenario_id: co-0013-long-call-then-yes
schema_version: 1
scenario_version: 1
description: Prospect chats for several turns then accepts; winner is not stood down.
layer: simulation
purpose: [regression, eval]
channel: voice
engine_profile: cascade
callout_fixture: {shift: SH-1, specialty: wound care, area: Jersey City,
                  starts_in_hours: 26, callout_nurse: CG-330}
roster_fixture:
  - {slug: CG-101, name: Ana Reyes, phone: "555-9101"}
  - {slug: CG-207, name: Bruno Silva, phone: "555-9207"}
  - {slug: CG-330, name: Carla Jones, phone: "555-9330"}
persona:
  style: chatty
  policy:
    - Talk for two turns about the weather and traffic before deciding.
    - On your third turn accept the shift clearly.
    - Do not ask about other caregivers.
expected_end_state: {shift: SH-1, status: filled, winner: CG-101}
expected_rank_order: [CG-101, CG-207]
max_turn_budget: 5
invariants: [single_winner_lock, winner_not_stood_down, scope_two_tools]
judge_rubric:
  - Did the agent confirm the nurse got the shift after she accepted?
gates: [oracle_verdict, winner_not_stood_down]
k_trials: 3
seed: 48
tags: [voice, b2, v6]
